xt-anchor="start" x="140" y="658">控制规则</text><rect fill="#EAECF0" height="34" rx="17.0" ry="17.0" stroke="#EAECF0" stroke-width="0" width="90" x="694" y="634" /><text fill="#344054" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="739.0" y="651.0">控制面</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="150" y="693.0">Command 可被拒绝；Event 追加记录已发生事实。</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="150" y="719.25">Executor 只消费授权工作，不拥有 Task 目标。</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="150" y="745.5">版本或范围变化后旧 Approval 失效。</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="1050">终态不是模型自述：completed 必须满足 Acceptance、Approval、Evidence 与 Side-effect 披露。</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end" x="1728" y="1050">ai-agent-platform · Formal Visual Asset · v1</text></svg>