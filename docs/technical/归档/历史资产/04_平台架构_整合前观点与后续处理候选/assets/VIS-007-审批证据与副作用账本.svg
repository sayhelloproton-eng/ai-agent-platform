085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="190" y="763.0">Task version 变化</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="190" y="789.25">Scope / target 变化</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="190" y="815.5">过期或撤销</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="190" y="841.75">风险等级升级</text><rect fill="#FFFFFF" height="210" rx="18" ry="18" stroke="#027A48" stroke-width="2" width="480" x="690" y="690" /><text fill="#172033" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="710" y="728">完成条件</text><rect fill="#EAECF0" height="34" rx="17.0" ry="17.0" stroke="#EAECF0" stroke-width="0" width="153" x="1001" y="704" /><text fill="#344054" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="1077.5" y="721.0">completed</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="720" y="763.0">Acceptance 通过</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="720" y="789.25">必要 Approval 存在</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="720" y="815.5">证据完整</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="720" y="841.75">副作用已披露</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="720" y="868.0">无未解决错误</text><rect fill="#FFFFFF" height="210" rx="18" ry="18" stroke="#B45309" stroke-width="2" width="420" x="1220" y="690" /><text fill="#172033" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="1240" y="728">不能替代证据</text><rect fill="#EAECF0" height="34" rx="17.0" ry="17.0" stroke="#EAECF0" stroke-width="0" width="90" x="1534" y="704" /><text fill="#344054" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="1579.0" y="721.0">禁止</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1250" y="763.0">模型摘要</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1250" y="789.25">“看起来成功”</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1250" y="815.5">未回读的 API 响应</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1250" y="841.75">缺少 Hash 的产物</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="1050">Commit、Push、发布、删除与权限变化都必须进入 Side-effect Ledger。</text><text fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end" x="1728" y="1050">ai-agent-platform · Formal Visual Asset · v1</text></svg>