nt-size="16" font-weight="600">Demo</text><text x="1440" y="502" text-anchor="start" fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="600">Portfolio</text><text x="90" y="220" text-anchor="start" fill="#172033" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="26" font-weight="700">证据门原则</text><text x="90" y="260" text-anchor="start" fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="500">上一层没有可定位证据，不扩大下一层实现。</text><text x="90" y="296" text-anchor="start" fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="500">成熟度表示产品能力是否可信，不是项目批次或日期。</text><rect x="950" y="175" width="750" height="105" rx="18" fill="#FFFFFF" stroke="#B8C2D1" stroke-width="2"/><text x="990" y="215" text-anchor="start" fill="#2563EB" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700">当前判断</text><text x="990" y="248" text-anchor="start" fill="#172033" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600">L1 已接受；L2 窄链路已验证；当前主缺口位于 L3。</text><text x="990" y="273" text-anchor="start" fill="#172033" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600">L5 需要 AI 视频工作流或其他真实产品完成纵向证明。</text><text x="72" y="1050" text-anchor="start" fill="#667085" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400">ai-agent-platform · Formal Visual Asset · v1</text></svg>