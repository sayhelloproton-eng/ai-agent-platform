version: 5
project: ai-agent-platform
source_of_truth:
  type: git
knowledge_source:
  path: docs/knowledge/
registry:
  root: platform-registry/
  asset_index: platform-registry/assets.yaml
  relation_index: platform-registry/relations.yaml
  projection_index: platform-registry/projections.yaml
  implementation_status: platform-registry/implementation-status.yaml
  release_index: platform-registry/releases.yaml
  engineering_insights: platform-registry/registries/engineering-insights/
projection:
  target: feishu
  mode: overwrite
  direction: one_way
  structure: one_to_one
  pre_read_content: false
  semantic_diff: false
  reverse_write_allowed: false
  require_write_preview: true
  require_human_confirmation: true
  require_api_verification: true
publisher:
  image_source: document_bundle
  image_reference_scheme: relative_local
  upload_images: true
  semantic_mirror_required: true
  write_projection_tokens_back_to_git: false
retrieval:
  strategy: index_first
  default_full_documents_limit: 3
  allow_implicit_full_repository_scan: false
  allow_implicit_full_feishu_scan: false
  private_context_requires_task_need: true
paths:
  docs_root: docs
  context_root: context
  knowledge_root: docs/knowledge
  technical_root: docs/technical
  learning_root: docs/learning
  adr_root: docs/adr
  templates_root: docs/templates
  archive_root: docs/technical/归档
  project_context: context/project-context.md
  architecture_context: context/architecture-context.md
  current_state: context/current-status.md
  roadmap: context/roadmap.md
  knowledge_strategy: context/knowledge-strategy.md
runtime_evidence:
  store_full_agent_logs_in_docs: false
  store_full_traces_in_docs: false
  store_reproducible_config_and_summary: true
security:
  auto_delete: false
  auto_move: false
  auto_permission_change: false
  auto_public_share: false
  auto_force_push: false
  private_context_is_secret_vault: false
document_bundles:
  resource_bearing_document_entry: README.md
  asset_directory: assets
  co_locate_assets: true
  same_branch_and_commit: true
  human_first: true
  ai_lossless: true
