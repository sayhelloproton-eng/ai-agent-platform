version: 2
project: ai-agent-platform
canonical_source: git

governance:
  asset_id_required: true
  formal_asset_requires_review: true
  accepted_adr_requires_human_approval: true
  preserve_superseded_history: true
  default_evidence_level: hypothesis

retrieval:
  strategy: index_first
  default_full_documents_limit: 3
  allow_implicit_full_repository_scan: false
  allow_implicit_full_feishu_scan: false
  private_context_requires_task_need: true

paths:
  docs_root: docs
  project_context: docs/00-context/CTX-001-project-context.md
  current_state: docs/00-context/CTX-002-current-state.md
  current_task: docs/00-context/current-task.md
  project_outline: docs/00-context/CTX-003-project-outline.md
  roadmap: docs/00-context/CTX-004-roadmap-6-months.md
  platform_vision: docs/01-product/PRD-001-platform-vision.md
  target_architecture: docs/02-architecture/ARC-001-platform-target-architecture.md
  delivery_architecture: docs/02-architecture/ARC-003-six-month-delivery-architecture.md
  domain_model: docs/03-domain/DOM-001-core-domain-model.md
  skill_design: docs/04-agent-system/skills/SKL-001-ai-knowledge.md
  workflows: docs/05-workflows
  knowledge_system: docs/06-knowledge-system
  solutions: docs/07-solutions
  research: docs/08-research
  experiments: docs/09-experiments
  adr: docs/10-adr
  engineering: docs/11-engineering
  operations: docs/12-operations
  portfolio: docs/13-portfolio
  asset_index: docs/_index/assets.yaml
  relation_index: docs/_index/relations.yaml
  feishu_map: docs/_index/feishu-map.yaml
  migration_inventory: docs/_index/migration-inventory.yaml
  templates: docs/_templates
  archive: docs/_archive

feishu:
  role: projection_and_native
  space_id: "<FEISHU_SPACE_ID>"
  conflict_policy: git_wins_for_projection
  project_status_projection_of: CTX-002
  native_root: 90_Feishu_Native
  archive_root: 99_Archive
  allow_reverse_sync: false
  require_write_preview: true
  require_human_confirmation: true
  require_read_back_verification: true

runtime_evidence:
  store_full_agent_logs_in_docs: false
  store_full_traces_in_docs: false
  store_reproducible_config_and_summary: true

security:
  auto_delete: false
  auto_move: false
  auto_permission_change: false
  auto_public_share: false
  auto_force_push: false
  private_context_is_secret_vault: false
