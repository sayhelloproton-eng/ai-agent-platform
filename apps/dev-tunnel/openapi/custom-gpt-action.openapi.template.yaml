openapi: 3.1.0
info:
  title: AI Agent Platform Controller Actions
  version: 1.4.0
  description: Create Phase 2 tasks, query authenticated task context, claim Controller work, submit constrained Controller commands, read Browser Host Approval Drafts, issue single-use Approval Grants, release claims, and query Runtime status through the Action Gateway.
servers:
  - url: ${DEV_TUNNEL_PUBLIC_BASE_URL}
paths:
  /v1/task-control/intake:
    post:
      operationId: intakePhase2Task
      summary: Create an idempotent Phase 2 Task with a versioned Plan and reference-only payload resources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskIntakeRequest"
      responses:
        "200":
          description: Task Intake receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerSuccessEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/approvals/drafts/lookup:
    post:
      operationId: getApprovalDraft
      summary: Read the Browser Host prechecked Approval Draft before issuing a one-time Grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDraftLookup"
      responses:
        "200":
          description: Approval Draft prepared by the real Browser Host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerSuccessEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/approvals/grants:
    post:
      operationId: issueApprovalGrant
      summary: Issue an authenticated single-use Browser Host Approval Grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalGrant"
      responses:
        "201":
          description: Approval Grant issued or idempotently confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerSuccessEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/controller/task-context:
    post:
      operationId: getTaskDecisionContext
      summary: Query the latest decision context before claiming a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskContextRequest"
      responses:
        "200":
          description: Current task decision context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerSuccessEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/controller/task-claim:
    post:
      operationId: claimControllerTask
      summary: Claim short-lived Controller processing rights after reading context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControllerClaimRequest"
      responses:
        "200":
          description: Controller claim and opaque claim token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerSuccessEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/controller/task-command:
    post:
      operationId: submitControllerCommand
      summary: Submit a constrained Controller business command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControllerCommandRequest"
      responses:
        "200":
          description: Updated Task, Plan, and immutable Event result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerSuccessEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/controller/task-release:
    post:
      operationId: releaseControllerTask
      summary: Release the current Controller claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControllerReleaseRequest"
      responses:
        "200":
          description: Claim release result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerSuccessEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/runtime/status:
    post:
      operationId: getRuntimeStatus
      summary: Query the authenticated local Runtime status
      responses:
        "200":
          description: Runtime status task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStatusResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: Local Runtime is unavailable
components:
  schemas:
    TaskIntakeRequest:
      type: object
      additionalProperties: false
      properties:
        contractVersion:
          type: string
          const: 1.0.0
        taskId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        objective:
          type: string
          minLength: 1
        requiredRole:
          type: string
          minLength: 1
        requirementRef:
          type: string
        goalRef:
          type: string
        conversationRef:
          type: string
        plan:
          $ref: "#/components/schemas/TaskIntakePlan"
        payloadResources:
          type: array
          items:
            $ref: "#/components/schemas/PayloadResource"
        idempotencyKey:
          type: string
          minLength: 1
        producerRef:
          type: string
        correlationId:
          type: string
      required:
        - contractVersion
        - taskId
        - title
        - objective
        - requiredRole
        - idempotencyKey
    TaskIntakePlan:
      type: object
      additionalProperties: false
      properties:
        source:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [user, controller, upstream, fixture]
            ref:
              type: string
          required: [type, ref]
        currentNodeId:
          type: string
        nodes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TaskIntakePlanNode"
      required: [source, nodes]
    TaskIntakePlanNode:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [DECISION, WORK, REVIEW, WAIT, APPROVAL, FINALIZE]
        requiredRole:
          type: string
        dependsOn:
          type: array
          items: { type: string }
        acceptanceCriteria:
          type: array
          items: { type: string }
        summary:
          type: string
      required: [nodeId, title, kind, requiredRole]
    PayloadResource:
      type: object
      additionalProperties: false
      properties:
        payloadRef:
          type: string
          minLength: 1
        value: {}
      required: [payloadRef, value]
    ApprovalDraftLookup:
      type: object
      additionalProperties: false
      properties:
        approvalRef:
          type: string
          minLength: 1
      required: [approvalRef]
    ApprovalGrant:
      type: object
      additionalProperties: false
      properties:
        approvalContractVersion:
          type: string
          const: 1.0.0
        approvalRef:
          type: string
        grantId:
          type: string
        actionFingerprint:
          type: string
        bindingId:
          type: string
        taskId:
          type: string
        commandId:
          type: string
        allowedActionType:
          type: string
          enum: [OBSERVE_PAGE, FOLLOW_LATEST, OPEN_OR_RESUME_SESSION, CONTINUE_ROLE_SESSION, SET_COMPOSER_TEXT, SUBMIT_MESSAGE, STOP_GENERATION, CLICK_REGISTERED_UI, WAIT_FOR_RESPONSE]
        pagePreconditionHash:
          type: string
        singleUse:
          type: boolean
          const: true
        expiresAt:
          type: string
          format: date-time
        consumedAt:
          type: [string, "null"]
          format: date-time
        consumedBy:
          type: [string, "null"]
      required: [approvalContractVersion, approvalRef, grantId, actionFingerprint, bindingId, taskId, commandId, allowedActionType, pagePreconditionHash, singleUse, expiresAt, consumedAt, consumedBy]
    TaskContextRequest:
      type: object
      additionalProperties: false
      properties:
        taskId:
          type: string
          minLength: 1
        eventCursor:
          type: integer
          minimum: 0
      required:
        - taskId
    ControllerClaimRequest:
      type: object
      additionalProperties: false
      properties:
        taskId:
          type: string
          minLength: 1
        expectedTaskVersion:
          type: integer
          minimum: 1
        idempotencyKey:
          type: string
          minLength: 1
      required:
        - taskId
        - expectedTaskVersion
        - idempotencyKey
    ControllerCommandRequest:
      type: object
      additionalProperties: false
      properties:
        taskId:
          type: string
          minLength: 1
        claimToken:
          type: string
          minLength: 1
        expectedTaskVersion:
          type: integer
          minimum: 1
        expectedPlanVersion:
          type: integer
          minimum: 1
          nullable: true
        idempotencyKey:
          type: string
          minLength: 1
        command:
          $ref: "#/components/schemas/ControllerCommand"
      required:
        - taskId
        - claimToken
        - expectedTaskVersion
        - expectedPlanVersion
        - idempotencyKey
        - command
    ControllerReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        taskId:
          type: string
          minLength: 1
        claimToken:
          type: string
          minLength: 1
        idempotencyKey:
          type: string
          minLength: 1
      required:
        - taskId
        - claimToken
        - idempotencyKey
    ControllerCommand:
      oneOf:
        - $ref: "#/components/schemas/CreatePlanControllerCommand"
        - $ref: "#/components/schemas/RevisePlanControllerCommand"
        - $ref: "#/components/schemas/AdvancePlanNodeControllerCommand"
        - $ref: "#/components/schemas/RequestRoleWorkControllerCommand"
        - $ref: "#/components/schemas/RequestApprovalControllerCommand"
        - $ref: "#/components/schemas/BlockTaskControllerCommand"
        - $ref: "#/components/schemas/CompleteTaskControllerCommand"
      description: Command-discriminated schema. The payload shape is selected by command.type so the model-facing Action contract matches server validation.
    CreatePlanControllerCommand:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: CREATE_PLAN
        reasonSummary:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/CreatePlanPayload"
      required: [type, reasonSummary, payload]
    CreatePlanPayload:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PlanNodeDraft"
      required: [nodes]
    RevisePlanControllerCommand:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: REVISE_PLAN
        reasonSummary:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/RevisePlanPayload"
      required: [type, reasonSummary, payload]
    RevisePlanPayload:
      type: object
      additionalProperties: false
      properties:
        operations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PlanRevisionOperation"
      required: [operations]
    AdvancePlanNodeControllerCommand:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: ADVANCE_PLAN_NODE
        reasonSummary:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/AdvancePlanNodePayload"
      required: [type, reasonSummary, payload]
    AdvancePlanNodePayload:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          type: string
          minLength: 1
        resultRefs:
          type: array
          items:
            type: string
            minLength: 1
        summary:
          type: string
          minLength: 1
      required: [nodeId]
    RequestRoleWorkControllerCommand:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: REQUEST_ROLE_WORK
        reasonSummary:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/RequestRoleWorkPayload"
      required: [type, reasonSummary, payload]
    RequestRoleWorkPayload:
      type: object
      additionalProperties: false
      description: Role-work request. Browser Host work has structural required fields; SUBMIT_MESSAGE additionally requires inputRef and a stable approvalRef before the Browser Host prepares the Approval Draft.
      properties:
        nodeId:
          type: string
          minLength: 1
        targetDomain:
          type: string
          minLength: 1
        requiredRole:
          type: string
          minLength: 1
          description: Work executor role. For Browser Host work this is browser-host, not the page role.
        objective:
          type: string
          minLength: 1
        capabilityRef:
          type: string
          minLength: 1
        inputRef:
          type: string
          minLength: 1
          description: Reference to an intake payload resource. Required for Local Control, Model Inference, and Browser actions that consume a payload such as SUBMIT_MESSAGE.
        expectedResultType:
          type: string
          minLength: 1
        expectedOutputContract:
          type: string
          minLength: 1
        targetRoleRef:
          type: string
          minLength: 1
          description: Browser page target role_ref, for example controller. Required when targetDomain is browser-host.
        targetProfileRef:
          type: string
          minLength: 1
          description: Browser Binding provider-native GPT ref (g-...), not the internal Controller profile id. Required when targetDomain is browser-host.
        conversationRef:
          type: string
          minLength: 1
          description: Browser Binding conversation_ref when targeting a specific conversation. It is page identity, not Task conversation context.
        hostActionType:
          type: string
          enum:
            - OBSERVE_PAGE
            - FOLLOW_LATEST
            - OPEN_OR_RESUME_SESSION
            - CONTINUE_ROLE_SESSION
            - SET_COMPOSER_TEXT
            - SUBMIT_MESSAGE
            - STOP_GENERATION
            - CLICK_REGISTERED_UI
            - WAIT_FOR_RESPONSE
        preconditions:
          type: object
          additionalProperties: true
        approvalRef:
          type: string
          minLength: 1
          description: Stable approval identity used to create/read the production Approval Draft. Required for Browser SUBMIT_MESSAGE.
        expiresAt:
          type: string
          format: date-time
      required: [nodeId, targetDomain, requiredRole, objective, expectedResultType]
      allOf:
        - if:
            properties:
              targetDomain:
                const: local-control
            required: [targetDomain]
          then:
            required: [capabilityRef, inputRef]
        - if:
            properties:
              targetDomain:
                const: model-inference
            required: [targetDomain]
          then:
            required: [capabilityRef, inputRef]
        - if:
            properties:
              targetDomain:
                const: browser-host
            required: [targetDomain]
          then:
            required: [targetRoleRef, targetProfileRef, hostActionType, expiresAt]
        - if:
            properties:
              targetDomain:
                const: browser-host
              hostActionType:
                enum:
                  - OPEN_OR_RESUME_SESSION
                  - CONTINUE_ROLE_SESSION
                  - SET_COMPOSER_TEXT
                  - SUBMIT_MESSAGE
                  - CLICK_REGISTERED_UI
            required: [targetDomain, hostActionType]
          then:
            required: [inputRef]
        - if:
            properties:
              targetDomain:
                const: browser-host
              hostActionType:
                const: SUBMIT_MESSAGE
            required: [targetDomain, hostActionType]
          then:
            required: [approvalRef]
      examples:
        - nodeId: browser-submit
          targetDomain: browser-host
          requiredRole: browser-host
          objective: Submit the approved message exactly once to the bound Controller conversation.
          inputRef: payload:browser-submit-example
          expectedResultType: browser-host-result-v0.1.0
          targetRoleRef: controller
          targetProfileRef: g-provider-native-controller-ref
          conversationRef: conversation-provider-native-ref
          hostActionType: SUBMIT_MESSAGE
          approvalRef: approval:browser-submit-example
          expiresAt: "2030-01-01T00:00:00.000Z"
    RequestApprovalControllerCommand:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: REQUEST_APPROVAL
        reasonSummary:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/RequestApprovalPayload"
      required: [type, reasonSummary, payload]
    RequestApprovalPayload:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        approvalRef:
          type: string
          minLength: 1
        grant:
          $ref: "#/components/schemas/ApprovalGrant"
      required: [nodeId, summary, approvalRef]
    BlockTaskControllerCommand:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: BLOCK_TASK
        reasonSummary:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/BlockTaskPayload"
      required: [type, reasonSummary, payload]
    BlockTaskPayload:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
      required: [reason]
    CompleteTaskControllerCommand:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: COMPLETE_TASK
        reasonSummary:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/CompleteTaskPayload"
      required: [type, reasonSummary, payload]
    CompleteTaskPayload:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
        resultRefs:
          type: array
          items:
            type: string
            minLength: 1
      required: [summary]
    PlanNodeDraft:
      type: object
      additionalProperties: false
      properties:
        nodeId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - DECISION
            - WORK
            - REVIEW
            - WAIT
            - APPROVAL
            - FINALIZE
        requiredRole:
          type: string
          minLength: 1
        dependsOn:
          type: array
          items:
            type: string
        acceptanceCriteria:
          type: array
          items:
            type: string
      required:
        - nodeId
        - title
        - kind
        - requiredRole
    PlanRevisionOperation:
      type: object
      properties:
        operation:
          type: string
          enum:
            - INSERT_NODE_AFTER
            - CANCEL_NODE
            - SKIP_NODE
        afterNodeId:
          type: string
        nodeId:
          type: string
        reasonSummary:
          type: string
        node:
          $ref: "#/components/schemas/PlanNodeDraft"
      required:
        - operation
    ControllerSuccessEnvelope:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        requestId:
          type: string
        data:
          type: object
          properties:
            contractVersion:
              type: string
            taskId:
              type: string
            taskVersion:
              type: integer
            claimToken:
              type: string
            commandId:
              type: string
            idempotentReplay:
              type: boolean
            task:
              type: object
              properties:
                taskId:
                  type: string
                taskVersion:
                  type: integer
                lifecycleStatus:
                  type: string
                requiredRole:
                  type: string
                plan:
                  type:
                    - object
                    - "null"
              required:
                - taskId
                - taskVersion
                - lifecycleStatus
                - requiredRole
      required:
        - ok
        - requestId
        - data
    RuntimeStatusResult:
      type: object
      properties:
        contractVersion:
          type: string
        taskId:
          type: string
        status:
          type: string
          enum:
            - succeeded
            - failed
            - rejected
            - timed_out
        output:
          type: object
          properties:
            runtime:
              type: string
            status:
              type: string
            capabilities:
              type: array
              items:
                type: string
      required:
        - contractVersion
        - taskId
        - status
        - output
    ErrorEnvelope:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        requestId:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - ok
        - requestId
        - error
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Bearer authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Controller role or project scope is not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Task was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Context, version, claim, plan, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
security:
  - bearerAuth: []
